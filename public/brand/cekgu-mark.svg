<!-- Light-ground variant. Ink is the light `ink` token (#17202b) from docs/DESIGN.md, written
     literally because currentColor does not inherit into an SVG loaded through an img element.
     The in-app mark is inline in src/client/components/Mark.tsx and does follow the theme.

     Token names are written without their CSS prefix on purpose: a double hyphen is illegal
     inside an XML comment, and it made this file fail to parse as a standalone document. It
     still rendered when inlined into HTML, which is why it went unnoticed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cekgu">
  <!-- The drawing occupies x 7..59.5 and y 8.5..53, so it sat 1.25 units right of centre and 1.25
       above it. Small, but this is the file that gets dropped into a square avatar or a round
       button, where the box is the frame and the offset shows. Both paths are geometry, so the
       bounds are exact rather than estimated. -->
  <g transform="translate(-1.25 1.25)">
    <path fill="#17202b" fill-rule="evenodd" d="M7 36a17 17 0 1 0 34 0a17 17 0 1 0-34 0M20.5 28a19.5 19.5 0 1 0 39 0a19.5 19.5 0 1 0-39 0M25.5 28a14.5 14.5 0 1 0 29 0a14.5 14.5 0 1 0-29 0"/>
    <path fill="none" stroke="#B3202F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M16 36l11 12q13-20 27-33"/>
  </g>
</svg>
