[project]
name = "muba-dev"
version = "0.1.0"
description = "MUBA Blockchain Hackathon 2026 - GonkaRouter track."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Vendored skills and agent config are third-party trees, same as in biome.json
# and .prettierignore. Not ours to lint.
extend-exclude = [".agents", ".claude", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
