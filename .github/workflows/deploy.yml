name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cekgu/cekgu:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Render environment variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: ./.github/scripts/render-env-vars.sh "$RUNNER_TEMP/env-vars.json"

      # A preview deploy rewrites spec.traffic from the implicit latest pointer to an
      # explicit revision pin, and a plain deploy then uploads a revision without moving
      # traffic to it. So route traffic explicitly, every time, and to the revision this
      # run built rather than to "latest", which a concurrent preview deploy could win.
      - name: Deploy with traffic
        id: deploy
        run: |
          revision=$(gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.image.outputs.image }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --ingress all \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --memory 1Gi \
            --timeout 300 \
            --env-vars-file "$RUNNER_TEMP/env-vars.json" \
            --quiet \
            --format='value(status.latestCreatedRevisionName)')
          echo "Built revision $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --to-revisions "$revision=100" \
            --quiet

      # The deploy above reports success even when traffic never moved, which is how a
      # stale revision served production unnoticed. Fail the run instead of reporting it.
      - name: Verify production serves the new revision
        id: verify
        env:
          EXPECTED_REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          service=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format=json)
          url=$(jq -r '.status.url' <<<"$service")
          serving=$(jq -r '[.status.traffic[] | select(.percent == 100 and .tag == null) | .revisionName] | first // "none"' <<<"$service")

          # Compare against the revision this run built, not the newest revision on the
          # service: a preview deploy for any open PR creates newer revisions constantly,
          # and comparing to those failed a deploy whose traffic was in fact correct.
          expected="$EXPECTED_REVISION"

          if [ "$serving" != "$expected" ]; then
            printf 'Traffic is on %s but this run deployed %s.\n' "$serving" "$expected" >&2
            exit 1
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$url/")
          if [ "$code" != '200' ]; then
            printf 'Production returned %s for GET /.\n' "$code" >&2
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Production is live at %s serving %s\n' "$url" "$serving" >> "$GITHUB_STEP_SUMMARY"

      # TRD section 18: the smoke pass runs against the deployed URL after every production
      # deploy. Run it against a preview on demand with E2E_BASE_URL=<preview url> bun run e2e.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Smoke test the deployment
        env:
          E2E_BASE_URL: ${{ steps.verify.outputs.url }}
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e
