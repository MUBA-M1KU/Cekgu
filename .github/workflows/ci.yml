name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck and tests
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Guard regression tests
        run: bun run test:guard

      - name: Test
        run: |
          if git ls-files -- '*.test.ts' '*.test.tsx' '*.test.js' '*.test.jsx' \
                            '*.spec.ts' '*.spec.tsx' '*.spec.js' '*.spec.jsx' | grep -q .; then
            bun test
          else
            echo 'No test files in the tree yet. bun test exits 1 on an empty suite, so it is skipped until the first test lands.'
          fi

  preview:
    name: Preview deploy
    needs: checks
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      # The tagged preview attaches to an existing service. Until the first push to
      # main creates it, say so on the PR instead of failing a check nobody can fix.
      - name: Check the service exists
        id: service
        run: |
          if gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
               --project "${{ vars.GCP_PROJECT_ID }}" \
               --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Cloud Run service not created yet; the first push to main creates it.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Docker for Artifact Registry
        if: steps.service.outputs.exists == 'true'
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: image
        if: steps.service.outputs.exists == 'true'
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cekgu/cekgu:${GITHUB_SHA}"
          docker build --tag "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # A preview shares production's DATABASE_URL, which TRD section 10 chose knowing previews
      # would write to production data. It did not anticipate a preview applying migrations to it
      # or running the guest sweep's delete loop against it, and an unreviewed revision must do
      # neither. Both flags default to on when unset, so production and local development are
      # untouched and neither name belongs in the section 8 contract.
      - name: Render environment variables
        if: steps.service.outputs.exists == 'true'
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          ./.github/scripts/render-env-vars.sh "$RUNNER_TEMP/env-vars.json"
          jq '. + { MIGRATE_ON_START: "false", WORKER_ENABLED: "false" }' \
            "$RUNNER_TEMP/env-vars.json" > "$RUNNER_TEMP/env-vars.preview.json"
          mv "$RUNNER_TEMP/env-vars.preview.json" "$RUNNER_TEMP/env-vars.json"
          printf 'Preview env: %s\n' "$(jq -r 'keys | join(", ")' "$RUNNER_TEMP/env-vars.json")"

      # The default shell is bash -e with no pipefail, which let a failed describe leave the URL
      # empty and the step green. shell: bash turns pipefail on for every pipe in the step.
      # No traffic, and min-instances 0 so a preview revision is not held warm.
      # Production keeps min-instances 1 from deploy.yml; that is a revision-level setting.
      - name: Deploy the pr-${{ github.event.pull_request.number }} revision
        id: deploy
        if: steps.service.outputs.exists == 'true'
        shell: bash
        run: |
          tag="pr-${{ github.event.pull_request.number }}"
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.image.outputs.image }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --port 8080 \
            --allow-unauthenticated \
            --ingress all \
            --min-instances 0 \
            --max-instances 1 \
            --no-cpu-throttling \
            --memory 1Gi \
            --timeout 300 \
            --env-vars-file "$RUNNER_TEMP/env-vars.json" \
            --tag "$tag" \
            --no-traffic \
            --quiet
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format=json | jq -r --arg tag "$tag" 'first(.status.traffic[]? | select(.tag == $tag) | .url) // empty')
          if [ -z "$url" ]; then
            echo "::error::no tagged url returned for $tag"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Preview: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL
        if: steps.service.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf 'Preview deploy for %s\n\n%s\n\nServes no production traffic. It shares production configuration, including the database.' "$GITHUB_SHA" "$URL")
          gh pr comment "$PR" --body "$body" --edit-last --create-if-none

  preview-cleanup:
    name: Remove the preview revision
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Remove the pr-${{ github.event.pull_request.number }} tag
        run: |
          tag="pr-${{ github.event.pull_request.number }}"
          if ! gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
                 --project "${{ vars.GCP_PROJECT_ID }}" \
                 --region "${{ vars.GCP_REGION }}" >/dev/null 2>&1; then
            echo "Service does not exist; nothing to clean up."
            exit 0
          fi
          gcloud run services update-traffic "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --remove-tags "$tag" \
            --quiet
