<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">One reading round, and what it refuses</title>
  <desc id="desc">A timeline of one reading round against the gateway, running left to right over two minutes. Each bar is one gateway call; the refused, timed out and discarded calls are drawn too, because the product records them.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a828c" />
    </marker>
    <style>
      text { font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #17202b; }
      .mono { font-family: 'Spline Sans Mono', ui-monospace, Menlo, Consolas, monospace; fill: #4f5a68; }
      .title { font-size: 24px; font-weight: 700; }
      .sub { font-size: 13px; fill: #4f5a68; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #7a828c; }
      .lane { font-size: 13px; font-weight: 600; text-anchor: end; }
      .lanesub { font-size: 11px; fill: #4f5a68; text-anchor: end; }
      .tick { font-size: 12px; font-weight: 600; fill: #4f5a68; text-anchor: middle; }
      .marklabel { font-size: 11px; font-weight: 700; fill: #b3202f; text-anchor: middle; }
      .endmark { text-anchor: end; }
      .barlabel { font-size: 12px; font-weight: 600; }
      .small { font-size: 12px; fill: #4f5a68; }
      .axis { stroke: #7a828c; stroke-width: 1.5; fill: none; }
      .guide { stroke: #b3202f; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
      .sheet { fill: #fbfaf7; stroke: #7a828c; stroke-width: 1.5; }
      .well { fill: #eae7e0; stroke: #d6d2c9; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1160" height="620" fill="#f1efea" />
  <text class="title" x="20" y="38">One reading round, and what it refuses</text>
  <text class="sub" x="20" y="60">Time runs left to right. Every bar below is one row in the attempts table.</text>

  <path class="axis" d="M200 150 H1120" />
  <path class="axis" d="M200 150 V143 M430 150 V143 M545 150 V143 M890 150 V143 M1120 150 V143" />
  <text class="tick" x="200" y="138">0 s</text>
  <text class="tick" x="430" y="138">30 s</text>
  <text class="tick" x="545" y="138">45 s</text>
  <text class="tick" x="890" y="138">90 s</text>
  <text class="tick" x="1120" y="138">120 s</text>

  <text class="lane" x="186" y="194">Seat A</text>
  <text class="lanesub mono" x="186" y="211">moonshotai/Kimi-K2.6</text>
  <rect x="200" y="181" width="429" height="30" rx="4" fill="#2c6e49" fill-opacity="0.18" stroke="#2c6e49" stroke-width="1.6" />
  <text class="barlabel" x="210" y="201" fill="#2c6e49">Admitted — receipt verified</text>

  <text class="lane" x="186" y="260">Seat A hedge</text>
  <text class="lanesub mono" x="186" y="277">fired at 45 s</text>
  <rect x="545" y="247" width="230" height="30" rx="4" fill="#5b6470" fill-opacity="0.18" stroke="#5b6470" stroke-width="1.6" stroke-dasharray="5 4" />
  <text class="barlabel" x="555" y="267" fill="#5b6470">Discarded — the first call won</text>

  <text class="lane" x="186" y="326">Seat B</text>
  <text class="lanesub mono" x="186" y="343">MiniMaxAI/MiniMax-M2.7</text>
  <rect x="200" y="313" width="176" height="30" rx="4" fill="#2c6e49" fill-opacity="0.18" stroke="#2c6e49" stroke-width="1.6" />
  <text class="barlabel" x="210" y="333" fill="#2c6e49">Admitted — verified</text>

  <text class="lane" x="186" y="392">Seat B, first try</text>
  <text class="lanesub mono" x="186" y="409">DeepSeek-V4-Flash</text>
  <rect x="200" y="379" width="46" height="30" rx="4" fill="#b3202f" fill-opacity="0.18" stroke="#b3202f" stroke-width="1.6" stroke-dasharray="5 4" />
  <text class="barlabel" x="256" y="399" fill="#b3202f">429 from the gateway — no request id exists, so none is shown</text>

  <text class="lane" x="186" y="458">Seat A, earlier try</text>
  <text class="lanesub mono" x="186" y="475">no response</text>
  <rect x="200" y="445" width="690" height="30" rx="4" fill="#5b6470" fill-opacity="0.18" stroke="#5b6470" stroke-width="1.6" stroke-dasharray="5 4" />
  <text class="barlabel" x="210" y="465" fill="#5b6470">Cut off at 90 s — recorded with no request id</text>

  <path class="guide" d="M545 158 V500" />
  <path class="guide" d="M890 158 V500" />
  <path class="guide" d="M1120 158 V500" />
  <text class="marklabel" x="545" y="118">hedge fires</text>
  <text class="marklabel" x="890" y="118">evidence cutoff</text>
  <text class="marklabel endmark" x="1120" y="118">call ceiling</text>

  <rect class="sheet" x="20" y="516" width="550" height="96" rx="4" />
  <text class="eyebrow" x="40" y="540">WHAT ENDS THE ROUND</text>
  <text class="small" x="40" y="560">Both seats hold an admitted reading from distinct models, or</text>
  <text class="small" x="40" y="578">every family has spent its budget of three attempts, or</text>
  <text class="small" x="40" y="596">the round ends Unverified — which is an answer, not a failure</text>

  <rect class="well" x="590" y="516" width="550" height="96" rx="4" />
  <text class="eyebrow" x="610" y="540">BUDGETS</text>
  <text class="small" x="610" y="560">4 gateway calls in flight, for the whole account</text>
  <text class="small" x="610" y="578">2 seats per item, 3 attempts per model family</text>
  <text class="small" x="610" y="596">a failing family is demoted to last, never dropped below two</text>
</svg>
