<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" role="img" aria-labelledby="title desc">
  <title id="title">Cekgu, pre-publication review for multiple-choice papers</title>
  <desc id="desc">The Cekgu lockup, an OMR answer bubble marked with a red pen tick, above the line "Pre-publication review for multiple-choice papers" and a row of the five verdicts a check can return.</desc>
  <defs>
    <style>
      text { font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #17202b; }
      .wordmark { font-size: 64px; font-weight: 700; letter-spacing: -1.4px; }
      .tag { font-size: 21px; fill: #17202b; }
      .sub { font-size: 16px; fill: #4f5a68; }
      .pill { stroke-width: 1.4; fill-opacity: 0.14; }
      .pilltext { font-size: 13px; font-weight: 700; }
      .c-clear { fill: #2c6e49; stroke: #2c6e49; }
      .c-key { fill: #a34a08; stroke: #a34a08; }
      .c-amb { fill: #6b4fbb; stroke: #6b4fbb; }
      .c-split { fill: #2456a6; stroke: #2456a6; }
      .c-unv { fill: #5b6470; stroke: #5b6470; }
    </style>
  </defs>

  <rect width="1160" height="300" fill="#f1efea" />

  <g transform="translate(400 42) scale(1.35)">
    <path fill="#17202b" fill-rule="evenodd" d="M7 36a17 17 0 1 0 34 0a17 17 0 1 0-34 0M20.5 28a19.5 19.5 0 1 0 39 0a19.5 19.5 0 1 0-39 0M25.5 28a14.5 14.5 0 1 0 29 0a14.5 14.5 0 1 0-29 0"/>
    <path fill="none" stroke="#B3202F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M16 36l11 12q13-20 27-33"/>
    <text class="wordmark" x="76" y="49" font-size="40" letter-spacing="-0.8">Cekgu</text>
  </g>

  <text class="tag" x="580" y="176" text-anchor="middle">Pre-publication review for multiple-choice papers</text>
  <text class="sub" x="580" y="206" text-anchor="middle">Two models answer every question blind, before your learners do.</text>

  <g transform="translate(-15 0)">
    <rect class="pill c-key" x="222" y="240" width="176" height="30" rx="15" />
    <text class="pilltext c-key" x="310" y="260" text-anchor="middle">Possible Key Error</text>
    <rect class="pill c-amb" x="410" y="240" width="182" height="30" rx="15" />
    <text class="pilltext c-amb" x="501" y="260" text-anchor="middle">Possible Ambiguity</text>
    <rect class="pill c-split" x="604" y="240" width="140" height="30" rx="15" />
    <text class="pilltext c-split" x="674" y="260" text-anchor="middle">Split Opinion</text>
    <rect class="pill c-unv" x="756" y="240" width="118" height="30" rx="15" />
    <text class="pilltext c-unv" x="815" y="260" text-anchor="middle">Unverified</text>
    <rect class="pill c-clear" x="886" y="240" width="82" height="30" rx="15" />
    <text class="pilltext c-clear" x="927" y="260" text-anchor="middle">Clear</text>
  </g>
</svg>
