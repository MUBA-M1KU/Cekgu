<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">How one check becomes a verdict</title>
  <desc id="desc">An educator submits a quiz paper with its answer key, and a worker claims the queued item and has it read twice by two no-fallback model seats behind the Gonka router. Each reading must pass a receipt check and five admission tests before verdict() returns one of five verdicts, and any failed check falls through to Unverified.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#17202b" /></marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#b3202f" /></marker>
    <style>
      text { font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; fill: #17202b; }
      .mono { font-family: 'Spline Sans Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #4f5a68; }
      .m11 { font-size: 11px; }
      .title { font-size: 24px; font-weight: 700; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #7a828c; }
      .heading { font-size: 15px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 12px; fill: #4f5a68; }
      .note { font-size: 13px; fill: #4f5a68; }
      .sheet { fill: #fbfaf7; stroke: #7a828c; stroke-width: 1.5; }
      .well { fill: #eae7e0; stroke: #d6d2c9; stroke-width: 1.5; }
      .gateway { fill: #eae7e0; stroke: #17202b; stroke-width: 2; }
      .person { fill: #fbfaf7; stroke: #17202b; stroke-width: 2; }
      .line { fill: none; stroke: #17202b; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #b3202f; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrowred); }
      .pen { fill: #b3202f; }
      .keytag { font-size: 12px; font-weight: 700; }
      .failabel { font-size: 11px; font-weight: 700; }
      .pill { stroke-width: 1.5; fill-opacity: 0.16; }
      .pilltext { font-size: 12px; font-weight: 700; }
      .c-clear { fill: #2c6e49; stroke: #2c6e49; }
      .c-key { fill: #a34a08; stroke: #a34a08; }
      .c-amb { fill: #6b4fbb; stroke: #6b4fbb; }
      .c-split { fill: #2456a6; stroke: #2456a6; }
      .c-unv { fill: #5b6470; stroke: #5b6470; }
    </style>
  </defs>
  <rect width="1160" height="620" fill="#f1efea" />
  <text class="title" x="580" y="40" text-anchor="middle">How one check becomes a verdict</text>

  <text class="eyebrow" x="40" y="76">1 — SUBMIT</text>
  <text class="eyebrow" x="290" y="76">2 — QUEUE</text>
  <text class="eyebrow" x="545" y="76">3 — READ, TWICE</text>
  <text class="eyebrow" x="890" y="76">4 — DECIDE</text>

  <rect class="person" x="40" y="92" width="180" height="58" rx="4" />
  <text class="heading" x="130" y="118" text-anchor="middle">Educator</text>
  <text class="small" x="130" y="137" text-anchor="middle">types a quiz and its key</text>
  <rect class="sheet" x="40" y="176" width="180" height="118" rx="4" />
  <text class="heading" x="58" y="200">The paper</text>
  <text class="small" x="58" y="222">12 questions</text>
  <text class="small" x="58" y="242">four options each</text>
  <text class="small" x="58" y="262">the answer key</text>
  <text class="pen keytag" x="58" y="284">the key stays here</text>
  <path class="line" d="M220 121 H282" />

  <rect class="sheet" x="290" y="92" width="200" height="52" rx="4" />
  <text class="mono" x="390" y="123" text-anchor="middle">POST /api/records</text>
  <path class="line" d="M390 144 V182" />
  <rect class="well" x="290" y="182" width="200" height="58" rx="4" />
  <text class="label" x="390" y="206" text-anchor="middle">items</text>
  <text class="small" x="390" y="226" text-anchor="middle">status = queued</text>
  <path class="line" d="M390 240 V282" />
  <rect class="sheet" x="290" y="282" width="200" height="76" rx="4" />
  <text class="label" x="390" y="306" text-anchor="middle">Worker claims one item</text>
  <text class="mono m11" x="390" y="328" text-anchor="middle">FOR UPDATE SKIP LOCKED</text>
  <text class="small" x="390" y="347" text-anchor="middle">one at a time, in order</text>
  <rect class="well" x="290" y="378" width="200" height="44" rx="4" />
  <text class="label" x="390" y="405" text-anchor="middle">Semaphore: 4 in flight</text>
  <path class="line" d="M490 118 H537" />

  <rect class="gateway" x="545" y="92" width="300" height="380" rx="4" />
  <text class="heading" x="695" y="118" text-anchor="middle">GonkaRouter</text>
  <text class="mono" x="695" y="137" text-anchor="middle">api.gonkarouter.io/v1</text>
  <rect class="sheet" x="565" y="156" width="260" height="86" rx="4" />
  <text class="label" x="581" y="180">Seat A</text>
  <text class="mono m11" x="581" y="201">moonshotai/Kimi-K2.6</text>
  <text class="mono m11" x="581" y="221">X-Gonka-No-Fallback: true</text>
  <rect class="sheet" x="565" y="256" width="260" height="86" rx="4" />
  <text class="label" x="581" y="280">Seat B</text>
  <text class="mono m11" x="581" y="301">MiniMaxAI/MiniMax-M2.7</text>
  <text class="mono m11" x="581" y="321">X-Gonka-No-Fallback: true</text>
  <path class="line" d="M695 242 V252" />
  <path class="line" d="M695 342 V352" />
  <rect class="well" x="565" y="356" width="260" height="96" rx="4" />
  <text class="label" x="581" y="380">Receipt check, per call</text>
  <text class="mono m11" x="581" y="401">GET /v1/receipts/{id}</text>
  <text class="small" x="581" y="421">public, unauthenticated</text>
  <text class="small" x="581" y="440">served model must match</text>
  <path class="line" d="M845 210 H886" />

  <rect class="sheet" x="890" y="156" width="230" height="164" rx="4" />
  <text class="heading" x="908" y="180">Admission test</text>
  <text class="small" x="908" y="204" xml:space="preserve">1  HTTP 200</text>
  <text class="small" x="908" y="226" xml:space="preserve">2  no fallback header</text>
  <text class="small" x="908" y="248" xml:space="preserve">3  receipt model matches</text>
  <text class="small" x="908" y="270" xml:space="preserve">4  the JSON parses</text>
  <text class="small" x="908" y="292" xml:space="preserve">5  answer is a real option</text>
  <path class="line" d="M1005 320 V352" />
  <rect class="sheet" x="890" y="352" width="230" height="52" rx="4" />
  <text class="mono" x="1005" y="383" text-anchor="middle">verdict()</text>
  <path class="line" d="M1005 404 V424" />
  <rect class="pill c-clear" x="890" y="424" width="230" height="26" rx="13" />
  <text class="pilltext c-clear" x="1005" y="441" text-anchor="middle">Clear</text>
  <rect class="pill c-key" x="890" y="456" width="230" height="26" rx="13" />
  <text class="pilltext c-key" x="1005" y="473" text-anchor="middle">Possible Key Error</text>
  <rect class="pill c-amb" x="890" y="488" width="230" height="26" rx="13" />
  <text class="pilltext c-amb" x="1005" y="505" text-anchor="middle">Possible Ambiguity</text>
  <rect class="pill c-split" x="890" y="520" width="230" height="26" rx="13" />
  <text class="pilltext c-split" x="1005" y="537" text-anchor="middle">Split Opinion</text>
  <rect class="pill c-unv" x="890" y="552" width="230" height="26" rx="13" />
  <text class="pilltext c-unv" x="1005" y="569" text-anchor="middle">Unverified</text>
  <path class="dash" d="M886 238 H860 Q846 238 846 252 V551 Q846 565 860 565 H886" />
  <text class="pen failabel" x="833" y="500" transform="rotate(-90 833 500)" text-anchor="middle">any check fails</text>

  <text class="note" x="40" y="600">Every attempt is recorded with its Gonka request id, admitted or not. Fewer than two verified readings from distinct models gives Unverified, never a guess.</text>
</svg>
