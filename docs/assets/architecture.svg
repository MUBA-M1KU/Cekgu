<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 600" width="1290" height="600" role="img" aria-labelledby="t d">
  <title id="t">Cekgu architecture</title>
  <desc id="d">A React SPA and a Hono API on one Cloud Run container, with a queue worker and a gateway semaphore behind it, PostgreSQL on Neon beside them, and every reasoning call leaving through GonkaRouter with a request id and a public receipt.</desc>
  <style>
    .sheet { fill: #ffffff; stroke: #d7dbe0; stroke-width: 1; filter: url(#sheet-shadow); }
    .well  { fill: #e3e6ea; stroke: none; }
    .inked { fill: #14181f; stroke: none; }
    .zone  { fill: none; stroke: #6b7480; stroke-width: 1; stroke-dasharray: 6 5; }
    .wire  { fill: none; stroke: #6b7480; stroke-width: 1.5; }
    .off   { stroke-dasharray: 6 5; }
    .name  { font: 600 15px 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif; fill: #14181f; }
    .note  { font: 400 13px 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif; fill: #4d5560; }
    .mono  { font: 400 13px 'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill: #4d5560; }
    .on-ink-name { font: 600 15px 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif; fill: #ffffff; }
    .on-ink-mono { font: 400 13px 'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill: #ffffff; opacity: .82; }
    .wired, .wired-mono, .eyebrow {
      fill: #4d5560; stroke: #edeff1; stroke-width: 6px; stroke-linejoin: round; paint-order: stroke fill;
    }
    .wired { font: 400 12px 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif; }
    .wired-mono { font: 400 12px 'Spline Sans Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font: 500 13px 'Schibsted Grotesk','Helvetica Neue',Arial,sans-serif; letter-spacing: .06em; }
  </style>
  <defs>
    <filter id="sheet-shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#14181f" flood-opacity="0.07"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6b7480"/>
    </marker>
  </defs>

  <rect width="1290" height="600" fill="#edeff1"/>

  <rect class="zone" x="350.5" y="40.5" width="589" height="531" rx="12"/>

  <path class="wire off" d="M 420 276 L 420 126 L 268 126" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <path class="wire" d="M 450 276 L 450 206 L 790 206 L 790 176" marker-end="url(#tip)"/>
  <path class="wire" d="M 920 126 L 1120 126 L 1120 268" marker-end="url(#tip)"/>
  <path class="wire" d="M 260 318 L 362 318" marker-end="url(#tip)"/>
  <path class="wire" d="M 590 318 L 692 318" marker-end="url(#tip)"/>
  <path class="wire" d="M 920 306 L 1022 306" marker-end="url(#tip)"/>
  <path class="wire" d="M 1030 330 L 928 330" marker-end="url(#tip)"/>
  <path class="wire" d="M 420 360 L 420 414 L 150 414 L 150 460" marker-end="url(#tip)"/>
  <path class="wire" d="M 790 468 L 790 368" marker-end="url(#tip)"/>
  <path class="wire" d="M 700 510 L 268 510" marker-end="url(#tip)"/>
  <path class="wire" d="M 860 360 L 860 430 L 1160 430 L 1160 460" marker-end="url(#tip)"/>

  <text class="eyebrow" x="370" y="70">GOOGLE CLOUD RUN · ONE CONTAINER</text>
  <g class="wired" text-anchor="middle">
    <text x="335" y="116">image or PDF, text back</text>
    <text x="620" y="196">record questions</text>
    <text x="311" y="308">fetch · SSE</text>
    <text x="641" y="308">structure a draft</text>
    <text x="975" y="296">no fallback</text>
    <text x="285" y="404">records · items</text>
    <text x="484" y="500">attempts · verdict</text>
    <text x="1010" y="420">confirm the served model</text>
  </g>
  <g class="wired-mono" text-anchor="middle">
    <text x="1020" y="116">own x-request-id</text>
    <text x="975" y="350">x-request-id</text>
  </g>
  <text class="wired" x="778" y="424" text-anchor="end">solver prompt</text>

  <rect class="well" x="40" y="84" width="220" height="84" rx="12"/>
  <text class="name" x="60" y="120">Vision Transcription</text>
  <text class="note" x="60" y="144">uploads only, decides nothing</text>

  <rect class="sheet" x="700.5" y="84.5" width="219" height="83" rx="12"/>
  <text class="name" x="720" y="120">Record Assistant</text>
  <text class="note" x="720" y="144">phrases facts it retrieved</text>

  <rect class="sheet" x="40.5" y="276.5" width="219" height="83" rx="12"/>
  <text class="name" x="60" y="312">React 19 SPA</text>
  <text class="note" x="60" y="336">records, evidence, receipts</text>

  <rect class="sheet" x="370.5" y="276.5" width="219" height="83" rx="12"/>
  <text class="name" x="390" y="312">Hono API</text>
  <text class="mono" x="390" y="336">/api/* · SSE</text>

  <rect class="sheet" x="700.5" y="276.5" width="219" height="83" rx="12"/>
  <text class="name" x="720" y="312">Gateway Semaphore</text>
  <text class="note" x="720" y="336">4 calls in flight</text>

  <rect class="inked" x="1030" y="276" width="220" height="84" rx="12"/>
  <text class="on-ink-name" x="1050" y="312">GonkaRouter</text>
  <text class="on-ink-mono" x="1050" y="336">api.gonkarouter.io/v1</text>

  <rect class="sheet" x="40.5" y="468.5" width="219" height="83" rx="12"/>
  <text class="name" x="60" y="504">PostgreSQL · Neon</text>
  <text class="note" x="60" y="528">records, items, attempts</text>

  <rect class="sheet" x="700.5" y="468.5" width="219" height="83" rx="12"/>
  <text class="name" x="720" y="504">Queue Worker</text>
  <text class="note" x="720" y="528">claim → round → verdict</text>

  <rect class="well" x="1030" y="468" width="220" height="84" rx="12"/>
  <text class="name" x="1050" y="504">Public Receipts</text>
  <text class="mono" x="1050" y="528">GET /v1/receipts/:id</text>
</svg>
